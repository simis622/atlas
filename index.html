<!doctype html>
<html lang="cs">

<head>
    <title>Atlas států</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Bootstrap CSS v5.2.1 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />

</head>

<body>
    <header class="bg-warning text-center p-3">
        <h1>Atlas států</h1>
        <div>
            <select id="continent">
                <option value="europe">Evropa</option>
                <option value="asia">Asie</option>
                <option value="africa">Afrika</option>
                <option value="americas">Amerika</option>
                <option value="oceania">Oceánie</option>
            </select>
        </div>
    </header>
    <main class="container-fluid">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-6 g-3 p-3" id="countries-list">
            <div class="col">
                <div class="card h-100 d-flex flex-column">
                    <img class="card-img-top" src="czech.png" alt="Česká republika" />
                    <div class="card-body d-flex flex-column">
                        <h4 class="card-title"><a href="#">Česká republika</a></h4>
                        <p class="card-text">Hlavní město: <b>Praha</b></p>
                        <p class="mt-auto mb-0"><button class="btn btn-info" data-bs-toggle="modal"
                                data-bs-target="#one-country">Informace</button></p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="bg-dark p-5 text-light text-center">
        &copy; IT2 - Marek Lučný
    </footer>
    <!-- The Modal -->
    <div class="modal" id="one-country">
        <div class="modal-dialog">
            <div class="modal-content">

                <!-- Modal Header -->
                <div class="modal-header bg-danger">
                    <h4 class="modal-title">Modal Heading</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <!-- Modal body -->
                <div class="modal-body" id="modal-body-content">
                    Modal body..
                </div>

                <!-- Modal footer -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JavaScript Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
        integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
        crossorigin="anonymous"></script>
    <script src="atlas.js"></script>
</body>

</html>
